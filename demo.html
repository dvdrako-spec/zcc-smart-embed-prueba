<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo helpdesk + ZCC</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e9eaee;font-family:system-ui,sans-serif}
  #escena{position:relative;width:100%;max-width:1227px;margin:0 auto}
  #escena img{display:block;width:100%;height:auto}
  .px{position:absolute}                       /* posiciones en % de la imagen 1227x749 */
  #zoomIcono{left:calc(1197/1227*100%);top:calc(342/749*100%);width:calc(24/1227*100%);height:calc(24/749*100%);
             border:2px solid #e5342f;border-radius:6px;background:rgba(229,52,47,.12);cursor:pointer;padding:0}
  #zoomIcono:hover{background:rgba(229,52,47,.3)}
  #nombre{left:calc(955/1227*100%);top:calc(262/749*100%);font-size:clamp(9px,1.15vw,14px);font-weight:600;color:#0b5cff}
  #caja{left:calc(922/1227*100%);top:calc(318/749*100%);width:calc(248/1227*100%);display:flex;gap:4px;background:#fff}
  #caja input{flex:1;min-width:0;padding:4px 6px;border:1px solid #bbb;border-radius:6px;font-size:12px}
  #caja button{border:0;background:#0b5cff;color:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px}
  #panel{position:fixed;right:56px;top:56px;width:380px;height:calc(100vh - 76px);background:#fff;border:1px solid #bbb;border-radius:10px;
         box-shadow:0 8px 30px rgba(0,0,0,.3);display:none;flex-direction:column;z-index:50;resize:both;overflow:hidden;min-width:300px;min-height:300px}
  #panel.abierto{display:flex}
  #panel .cab{padding:8px 12px;font-size:13px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;background:#f4f4f4;cursor:move;user-select:none}
  #panel .cab a{text-decoration:none;color:#333;margin-left:10px;cursor:pointer}
  #zoom-embeddable-phone-iframe{flex:1;width:100%;border:0}
  #log{max-width:1227px;margin:8px auto;height:140px;overflow:auto;background:#111;color:#cfe8cf;font-size:11px;padding:8px;white-space:pre-wrap;border-radius:8px}
  .enlace{color:#ffd479}
</style>
</head>
<body>
<div id="escena">
  <img src="demo-fresh.png" alt="Ticket de ejemplo">
  <button class="px" id="zoomIcono" title="Zoom Contact Center"></button>
  <div class="px" id="nombre">Cliente de prueba</div>
  <div class="px" id="caja"><input id="tel" placeholder="+34XXXXXXXXX"><button id="llamar">📞 Llamar</button></div>
</div>
<div id="log"></div>

<aside id="panel">
  <div class="cab" id="cab"><span>Zoom Contact Center</span><span><a id="cerrar" title="Cerrar">✕</a></span></div>
</aside>

<script>
  const BASE_SMART_EMBED="https://zoom.us/cci/callbar/crm/";
  const TICKET="61542";   // el de la captura; solo para la demo
  const panel=document.getElementById("panel"), log=document.getElementById("log");
  const escribe=(t,c)=>{const l=document.createElement("div");if(c)l.className=c;l.textContent=new Date().toLocaleTimeString("es-ES")+"  "+t;log.appendChild(l);log.scrollTop=log.scrollHeight;};

  const iframe=document.createElement("iframe");
  iframe.id="zoom-embeddable-phone-iframe";
  iframe.src=BASE_SMART_EMBED+"?origin="+location.origin;
  iframe.setAttribute("sandbox","allow-forms allow-popups allow-popups-to-escape-sandbox allow-scripts allow-same-origin allow-downloads");
  iframe.setAttribute("allow",";autoplay;microphone;camera;display-capture;midi;encrypted-media;clipboard-write;");
  panel.appendChild(iframe);

  document.getElementById("zoomIcono").onclick=()=>panel.classList.toggle("abierto");
  document.getElementById("cerrar").onclick=()=>panel.classList.remove("abierto");

  // el panel es flotante: se arrastra por la cabecera
  (()=>{const cab=document.getElementById("cab");let d=null;
    cab.addEventListener("mousedown",e=>{if(e.target.tagName==="A")return;const r=panel.getBoundingClientRect();
      d={x:e.clientX-r.left,y:e.clientY-r.top};iframe.style.pointerEvents="none";e.preventDefault();});
    window.addEventListener("mousemove",e=>{if(!d)return;panel.style.left=(e.clientX-d.x)+"px";panel.style.top=(e.clientY-d.y)+"px";panel.style.right="auto";});
    window.addEventListener("mouseup",()=>{d=null;iframe.style.pointerEvents="";});})();

  const enlaces={};
  window.addEventListener("message",(e)=>{
    let host="";try{host=new URL(e.origin).hostname;}catch{return;}
    if(!host.endsWith("zoom.us"))return;
    const m=e.data;
    if(!m||typeof m.type!=="string"||!m.type.startsWith("zcc-"))return;
    escribe(m.type+(m.data?"  "+JSON.stringify(m.data):""));
    if(m.type==="zcc-init-config-request")
      iframe.contentWindow.postMessage({type:"zcc-init-config-response",data:{phone:{screenPopEvent:"RINGING"}}},"*");
    if(m.type==="zcc-outbound-call-started"&&m.data?.engagementId){
      enlaces[m.data.engagementId]=TICKET;
      escribe(`ENLACE: llamada ${m.data.engagementId} <-> ticket ${TICKET}`,"enlace");
    }
    if(m.type==="zcc-phone-call-log"){
      const id=m.data?.engagementId;
      escribe(`FIN: llamada ${id} del ticket ${enlaces[id]??"(sin enlace)"}`,"enlace");
    }
  });

  document.getElementById("llamar").onclick=()=>{
    const phone=document.getElementById("tel").value.trim();
    if(!phone){escribe("Falta el teléfono");return;}
    panel.classList.add("abierto");
    escribe(`Pidiendo llamada a ${phone} (ticket ${TICKET})`);
    iframe.contentWindow.postMessage({type:"onclicktoact",data:{id:TICKET,name:"Ticket "+TICKET,phone,userEntity:"ticket"}},"*");
  };
</script>
</body>
</html>
